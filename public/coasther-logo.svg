<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1416" />
      <stop offset="50%" stop-color="#660A0C" />
      <stop offset="100%" stop-color="#2D0506" />
    </linearGradient>
    
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE09B" />
      <stop offset="50%" stop-color="#C6A971" />
      <stop offset="100%" stop-color="#9A7B3E" />
    </linearGradient>

    <!-- Energy Bolt Gradient (Green to Gold) -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Squircle -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base / App Icon Shape -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#cardShadow)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Subtle IoT Grid / Ring Elements -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- IoT Wave Arcs in Corner (Telemetry / Monitoring) -->
  <path d="M 370 115 A 50 50 0 0 1 405 150" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M 385 100 A 70 70 0 0 1 425 140" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.45" />
  <circle cx="410" cy="100" r="4" fill="#34D399" filter="url(#softGlow)" />

  <!-- EMBLEM: Stylized Broiler Chicken + Energy Conservation -->
  <!-- Chicken Comb (3 Crown points - Modern & sleek) -->
  <path d="M 205 145 C 205 125, 225 120, 230 135 C 238 118, 258 118, 262 135 C 270 120, 290 125, 288 150 Z" 
        fill="url(#goldGrad)" />

  <!-- Chicken Head & Beak Silhouette -->
  <!-- Beak -->
  <polygon points="310,185 348,198 310,212" fill="url(#goldGrad)" />
  <polygon points="310,212 328,218 310,224" fill="#E5C378" opacity="0.8" />

  <!-- Head & Neck -->
  <path d="M 235 155 
           C 275 155, 315 170, 315 205 
           C 315 220, 305 235, 290 245
           C 295 270, 305 310, 320 340
           C 300 345, 275 345, 250 340
           C 230 300, 225 240, 220 200
           C 215 175, 225 155, 235 155 Z" 
        fill="#FFFFFF" />

  <!-- Eye (Smart Digital Ring) -->
  <circle cx="282" cy="188" r="7" fill="#7B1113" />
  <circle cx="284" cy="186" r="2.5" fill="#FFFFFF" />

  <!-- Wattle (Gelambir) - subtle gold teardrop -->
  <path d="M 292 230 C 298 230, 302 240, 296 250 C 290 255, 284 245, 288 235 Z" fill="url(#goldGrad)" />

  <!-- Broiler Robust Breast & Body Curves -->
  <path d="M 130 310 
           C 130 245, 185 190, 240 185 
           C 210 220, 205 265, 205 315 
           C 205 365, 245 400, 305 400 
           C 230 415, 130 380, 130 310 Z" 
        fill="#F3F4F6" opacity="0.95" />

  <!-- DYNAMIC ENERGY BOLT / PETIR HEMAT ENERGI (Integrated seamlessly into the wing/chest) -->
  <path d="M 235 220 
           L 180 305 
           L 225 305 
           L 175 390 
           L 265 285 
           L 220 285 
           Z" 
        fill="url(#energyGrad)" 
        filter="url(#softGlow)" />

  <!-- Leaf Accent (Sustainability / Eco Efficiency) inside the wing -->
  <path d="M 155 260 
           C 145 280, 150 310, 175 320 
           C 175 295, 170 275, 155 260 Z" 
        fill="#10B981" opacity="0.85" />

  <!-- Base Baseline / Smart Meter Line Indicator -->
  <rect x="180" y="420" width="152" height="8" rx="4" fill="url(#goldGrad)" opacity="0.9" />
  <circle cx="205" cy="424" r="3" fill="#FFFFFF" />
  <circle cx="256" cy="424" r="3" fill="#34D399" />
  <circle cx="307" cy="424" r="3" fill="#FFFFFF" />
</svg>
